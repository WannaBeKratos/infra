# Checkov gate for CI (see .github/workflows/terraform.yml). Scans the repo's own
# Terraform; vendored modules and local state dirs are out of scope.
framework:
  - terraform
skip-path:
  - .terraform
  - .terraform-linux
  - bootstrap/.terraform
skip-check:
  # cloudflared takes its tunnel token as TUNNEL_TOKEN by design; there is no
  # file-based alternative worth a wrapper.
  - CKV_K8S_35
compact: true
quiet: true
