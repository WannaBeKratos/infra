# CI for the infra repository. Every push and pull request gets format, validate
# and a Checkov policy scan; branches with the secrets configured also get a real
# `terraform plan` against the R2 state, reaching the kube-API through the same
# Cloudflare Access tunnel the deploy workflow uses. Applies stay manual (WSL),
# by policy — CI proves a change plans cleanly, a person runs it.
#
# Secrets (set from WSL, never committed):
#   gh secret set BACKEND_HCL       < backend.hcl
#   gh secret set TERRAFORM_TFVARS  < terraform.tfvars
#   gh secret set SSH_PUBLIC_KEY      < ~/.ssh/hetzner_kube.pub
#   gh secret set SSH_PUBLIC_KEY_PROD < ~/.ssh/hetzner_kube_prod.pub
# plus one Access token pair per workspace; see the README's secrets section.
name: Terraform

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No terraform init here on purpose: only the repo's own files are policy,
      # not the vendored module. Config and skip reasons live in .checkov.yaml.
      - uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yaml

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history: a secret removed in the working tree is still a
          # secret if any reachable commit carries it.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for public repositories and personal accounts; organisations
          # need GITLEAKS_LICENSE.
          GITLEAKS_CONFIG: .gitleaks.toml

  plan:
    name: Plan (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    needs: validate
    # The production plan only runs where production is at stake: a pull request
    # aimed at main, or main itself.
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && fromJSON('["dev", "production"]') || fromJSON('["dev"]') }}
    # Without the secrets the job is skipped rather than failed, so the repo
    # works before they are configured; once branch protection requires this
    # check, configure them.
    # Also skipped for pull requests from forks: they run without secrets, so the
    # plan could only fail. Validate, Checkov and gitleaks still gate fork PRs.
    if: ${{ vars.TERRAFORM_PLAN_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_DATA_DIR: .terraform-ci
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"

      - name: Materialise backend and variables
        env:
          BACKEND_HCL: ${{ secrets.BACKEND_HCL }}
          TERRAFORM_TFVARS: ${{ secrets.TERRAFORM_TFVARS }}
        run: |
          umask 077
          printf '%s' "$BACKEND_HCL" > backend.hcl
          printf '%s' "$TERRAFORM_TFVARS" > terraform.tfvars
          test -s backend.hcl && test -s terraform.tfvars

      # The module reads the SSH keypair files at plan time. The runner gets the
      # real PUBLIC keys (so the hcloud key resource shows no false diff) and
      # freshly generated throwaway private keys — private keys are only used at
      # apply, and CI never applies.
      - name: Materialise SSH key files
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SSH_PUBLIC_KEY_PROD: ${{ secrets.SSH_PUBLIC_KEY_PROD }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N "" -q -f ~/.ssh/hetzner_kube
          ssh-keygen -t ed25519 -N "" -q -f ~/.ssh/hetzner_kube_prod
          printf '%s\n' "$SSH_PUBLIC_KEY" > ~/.ssh/hetzner_kube.pub
          printf '%s\n' "$SSH_PUBLIC_KEY_PROD" > ~/.ssh/hetzner_kube_prod.pub
          test -s ~/.ssh/hetzner_kube.pub && test -s ~/.ssh/hetzner_kube_prod.pub

      # Each cluster mints its own Access service token, and each kube-API
      # Access application only trusts its own. One pair per workspace, the
      # same way the SSH public keys are split.
      - name: Open a tunnel to the kube-API
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CF_ACCESS_CLIENT_ID_PROD: ${{ secrets.CF_ACCESS_CLIENT_ID_PROD }}
          CF_ACCESS_CLIENT_SECRET_PROD: ${{ secrets.CF_ACCESS_CLIENT_SECRET_PROD }}
        run: |
          if [ "${{ matrix.workspace }}" = "production" ]; then
            KUBE_API_HOST="${{ vars.KUBE_API_HOST_PROD }}"
            export TUNNEL_SERVICE_TOKEN_ID="$CF_ACCESS_CLIENT_ID_PROD"
            export TUNNEL_SERVICE_TOKEN_SECRET="$CF_ACCESS_CLIENT_SECRET_PROD"
          else
            KUBE_API_HOST="${{ vars.KUBE_API_HOST_DEV }}"
            export TUNNEL_SERVICE_TOKEN_ID="$CF_ACCESS_CLIENT_ID"
            export TUNNEL_SERVICE_TOKEN_SECRET="$CF_ACCESS_CLIENT_SECRET"
          fi
          curl -fsSL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared
          cloudflared access tcp --hostname "$KUBE_API_HOST" --url 127.0.0.1:6443 &
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/6443) 2>/dev/null && break
            sleep 1
          done

      - name: Plan
        # The full diff stays off the public log: the gate is the exit code and
        # the summary counts. Sensitive values are masked by Terraform anyway;
        # this keeps resource names and addresses private too. Run the plan
        # locally when the detail matters.
        run: |
          terraform init -input=false -backend-config=backend.hcl > /dev/null
          terraform workspace select ${{ matrix.workspace }}
          terraform plan -input=false -lock=false -no-color -var kube_api_url=https://127.0.0.1:6443 > plan.out
          grep -E "^(Plan:|No changes)" plan.out || tail -n 3 plan.out
