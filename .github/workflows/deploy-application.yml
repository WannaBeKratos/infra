name: Deploy application

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      production_branch:
        type: string
        default: main
      development_branch:
        type: string
        default: development
      port:
        type: number
        default: 8080
      health_path:
        type: string
        default: /healthz
      replicas:
        type: number
        default: 1
      dockerfile:
        type: string
        default: Dockerfile
      production_build_args:
        type: string
        default: ""
      development_build_args:
        type: string
        default: ""
    secrets:
      # Base64 deployer kubeconfig for the app's namespace (the infra repo's
      # `deployer_kubeconfigs` output). Store one per GitHub environment only:
      # development -> projects-dev, production -> projects-production.
      KUBE_CONFIG:
        required: true
      # PAT with read:packages and an expiry date, used as the in-cluster pull secret.
      GHCR_PULL_TOKEN:
        required: true
      # This app's own Cloudflare Access service token (the infra repo's
      # `ci_access_tokens` output): the kube-API is only reachable through the
      # Access-gated tunnel route, never directly.
      CF_ACCESS_CLIENT_ID:
        required: true
      CF_ACCESS_CLIENT_SECRET:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.ref_name == inputs.production_branch || github.ref_name == inputs.development_branch
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == inputs.production_branch && 'production' || 'development' }}
    steps:
      # The caller names its own production branch, so this is only a backstop:
      # the real gate is the production environment's deployment branch policy.
      - name: Refuse an unprotected production branch
        if: github.ref_name == inputs.production_branch && !github.ref_protected
        run: |
          echo "::error::$GITHUB_REF_NAME deploys to production but has no branch protection or ruleset."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.app_name }}:${{ github.ref_name }}-${{ github.sha }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          PRODUCTION_BRANCH: ${{ inputs.production_branch }}
          PRODUCTION_BUILD_ARGS: ${{ inputs.production_build_args }}
          DEVELOPMENT_BUILD_ARGS: ${{ inputs.development_build_args }}
        run: |
          IMAGE="${IMAGE,,}"  # GHCR requires a lowercase repository path
          if [ "$GITHUB_REF_NAME" = "$PRODUCTION_BRANCH" ]; then
            BUILD_ARGS="$PRODUCTION_BUILD_ARGS"
          else
            BUILD_ARGS="$DEVELOPMENT_BUILD_ARGS"
          fi
          # Build arguments are controlled by the caller workflow, not user input.
          # GIT_SHA lets an image state the commit it was built from rather than guess; a
          # Dockerfile that declares no such ARG just ignores it (a warning, not a failure).
          docker build $BUILD_ARGS --build-arg GIT_SHA="$GITHUB_SHA" \
            --file "$DOCKERFILE" --tag "$IMAGE" .
          docker push "$IMAGE"
      # Pinned and checksummed, and installed before any secret is on disk:
      # these binaries run next to the kubeconfig and the Access token.
      # cloudflared matches the in-cluster image (modules/edge/main.tf);
      # kubectl-argo-rollouts matches the controller the chart installs (rollouts.tf).
      - name: Install cloudflared and kubectl-argo-rollouts
        run: |
          curl -fsSLo /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64
          curl -fsSLo /usr/local/bin/kubectl-argo-rollouts \
            https://github.com/argoproj/argo-rollouts/releases/download/v1.9.1/kubectl-argo-rollouts-linux-amd64
          sha256sum -c - <<'EOF'
          77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2  /usr/local/bin/cloudflared
          466d93ccf767e975691359c6c9bb6750696e54c336d28ccd4d39e0f0519e8bf6  /usr/local/bin/kubectl-argo-rollouts
          EOF
          chmod +x /usr/local/bin/cloudflared /usr/local/bin/kubectl-argo-rollouts
      - name: Deploy to Kubernetes
        env:
          APP_NAME: ${{ inputs.app_name }}
          PRODUCTION_BRANCH: ${{ inputs.production_branch }}
          PORT: ${{ inputs.port }}
          HEALTH_PATH: ${{ inputs.health_path }}
          REPLICAS: ${{ inputs.replicas }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.app_name }}:${{ github.ref_name }}-${{ github.sha }}
          REGISTRY_USER: ${{ github.repository_owner }}
          KUBE_API_HOST_DEV: ${{ vars.KUBE_API_HOST_DEV }}
          KUBE_API_HOST_PROD: ${{ vars.KUBE_API_HOST_PROD }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          IMAGE="${IMAGE,,}"  # GHCR requires a lowercase repository path
          if [ "$GITHUB_REF_NAME" != "$PRODUCTION_BRANCH" ]; then
            APP_NAME="${APP_NAME}-test"
            KUBE_API_HOST="$KUBE_API_HOST_DEV"
            PROMOTE_SECONDS=30
          else
            KUBE_API_HOST="$KUBE_API_HOST_PROD"
            # The new version serves on preview.<hostname> (Cloudflare Access
            # gated) for ten minutes before promotion; abort with
            # `kubectl argo rollouts abort` to reject it.
            PROMOTE_SECONDS=600
          fi
          export APP_NAME PROMOTE_SECONDS
          umask 077
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          # kube-API access rides the Cloudflare tunnel: local TCP proxy, then
          # point the kubeconfig at it (the k3s cert includes 127.0.0.1).
          cloudflared access tcp --hostname "$KUBE_API_HOST" --url 127.0.0.1:6443 &
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/6443) 2>/dev/null && break
            sleep 1
          done
          CLUSTER=$(kubectl config view -o jsonpath='{.contexts[0].context.cluster}')
          kubectl config set-cluster "$CLUSTER" --server=https://127.0.0.1:6443
          # The namespace already exists: Terraform owns it (infra repo, services.tf).
          kubectl -n "$APP_NAME" create secret docker-registry registry-ghcr \
            --docker-server=ghcr.io \
            --docker-username="$REGISTRY_USER" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          # Only these six are substituted; any other $ in the manifest (shell
          # scripts in container args, k8s $(VAR) expansion) passes through.
          envsubst '$APP_NAME $REPLICAS $IMAGE $PORT $HEALTH_PATH $PROMOTE_SECONDS' \
            < kubernetes/application.yaml | kubectl apply -f -
          # Waits through the preview window; aborts fail this job and leave stable serving.
          kubectl argo rollouts -n "$APP_NAME" status "$APP_NAME" --timeout 15m
