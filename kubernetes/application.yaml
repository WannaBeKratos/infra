apiVersion: v1
kind: Namespace
metadata:
  name: ${APP_NAME}
---
apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAME}
spec:
  selector:
    app.kubernetes.io/name: ${APP_NAME}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME}-preview
  namespace: ${APP_NAME}
spec:
  selector:
    app.kubernetes.io/name: ${APP_NAME}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAME}
spec:
  replicas: ${REPLICAS}
  # Blue/green: the new version serves only on the preview Service until
  # auto-promotion, then the active Service switches atomically - no
  # mixed-version requests. Failing probes abort and keep stable serving.
  strategy:
    blueGreen:
      activeService: ${APP_NAME}
      previewService: ${APP_NAME}-preview
      autoPromotionSeconds: ${PROMOTE_SECONDS}
      scaleDownDelaySeconds: 60
  selector:
    matchLabels:
      app.kubernetes.io/name: ${APP_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${APP_NAME}
    spec:
      imagePullSecrets:
        - name: registry-ghcr
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: ${PORT}
          envFrom:
            # Terraform-managed (services.tf in the infra repo), optional so a
            # first deploy works before the Secret exists.
            - secretRef:
                name: ${APP_NAME}-env
                optional: true
          readinessProbe:
            httpGet:
              path: ${HEALTH_PATH}
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: ${HEALTH_PATH}
              port: http
            initialDelaySeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
